services:
  vaporstats:
    container_name: vaporstats
    image: vaporstats:${VAPORSTATS_IMAGE_TAG:-current}
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/vaporstats.sqlite
      DATABASE_SNAPSHOT_DIR: /app/data/snapshots
    volumes:
      - ./data:/app/data
    networks:
      - caddy
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch("http://127.0.0.1:3000/").then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  caddy:
    external: true

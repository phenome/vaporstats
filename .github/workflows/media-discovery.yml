name: Media discovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: Media watchlist action
        required: true
        type: choice
        options: [watch, unwatch]
      game:
        description: Catalog slug or AppID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vaporstats-media-discovery
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$TARGET_HOST"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/vaporstats_deploy"
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA51h5nwC1jWsVxRCe9xuhpxh4/dCGtpvsT42YtCaq7m\n' "$TARGET_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vaporstats_deploy" "$HOME/.ssh/known_hosts"

      - name: Trigger media discovery
        env:
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_GAME: ${{ inputs.game }}
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          case "$INPUT_ACTION" in
            watch|unwatch) ;;
            *) printf '%s\n' 'unsupported media action' >&2; exit 1 ;;
          esac
          if [[ "$INPUT_GAME" =~ ^[0-9]+$ ]]; then
            [[ "$INPUT_GAME" =~ ^[1-9][0-9]{0,9}$ ]] || { printf '%s\n' 'invalid AppID' >&2; exit 1; }
          else
            [[ ${#INPUT_GAME} -le 128 && "$INPUT_GAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { printf '%s\n' 'invalid catalog slug' >&2; exit 1; }
          fi
          remote_command="media $INPUT_ACTION $INPUT_GAME"
          set +e
          stderr_file=$(mktemp)
          response=$(ssh -i "$HOME/.ssh/vaporstats_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            "vaporstats-deploy@$TARGET_HOST" \
            "$remote_command" 2>"$stderr_file")
          status=$?
          diagnostic=$(<"$stderr_file")
          rm -f "$stderr_file"
          set -e
          if [[ -n "$diagnostic" ]]; then
            diagnostic=${diagnostic//$'\r'/ }
            diagnostic=${diagnostic//$'\n'/ }
            diagnostic=${diagnostic//"$TARGET_HOST"/'[redacted host]'}
            printf 'remote media discovery diagnostic: %s\n' "${diagnostic:0:8192}" >&2
          elif (( status != 0 )); then
            printf 'remote media discovery failed with SSH status %d\n' "$status" >&2
          fi
          printf 'media discovery result: %s\n' "${response:0:8192}"
          if (( ${#response} > 8192 )); then
            printf '%s' "${response:0:8192}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s' "$response" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Remove deployment SSH key
        if: always()
        run: rm -f "$HOME/.ssh/vaporstats_deploy" "$HOME/.ssh/known_hosts"
